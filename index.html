<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Свидание</title>
  <style>
    * {
      box-sizing: border-box;
    }
    :root {
      --black: #111;
      --muted: #777;
      --line: #d8d8d8;
      --red: #c0392b;
      --soft-red: #e74c3c;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: var(--black);
      overflow-x: hidden;
    }
    button {
      font: inherit;
      color: inherit;
      background: #fff;
      border: 1px solid var(--black);
      cursor: pointer;
    }
    .hidden {
      display: none !important;
    }

    /* плавные переходы */
    .screen {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 28px;
      text-align: center;
    }
    .fade-in {
      animation: fadeIn .55s cubic-bezier(.22, .61, .36, 1) both;
    }
    .fade-out {
      animation: fadeOut .3s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: none; }
      to { opacity: 0; transform: translateY(-12px); }
    }

    /* сердечки — красные, без артефактов */
    .heart {
      position: absolute;
      font-size: 28px;
      font-weight: 300;
      line-height: 1;
      user-select: none;
      color: #d44c4c;
    }
    .heart.top {
      top: 68px;
      left: 50%;
      transform: translateX(-50%) rotate(-8deg);
    }
    .heart.bottom {
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%) rotate(7deg);
    }
    .heart.small1 {
      top: 27%;
      left: 34%;
      font-size: 15px;
      transform: rotate(-25deg);
      color: #d44c4c;
    }
    .heart.small2 {
      top: 29%;
      right: 35%;
      font-size: 12px;
      transform: rotate(20deg);
      color: #d44c4c;
    }

    .hero-title {
      max-width: 760px;
      margin: 0 0 48px;
      font-size: clamp(42px, 6.5vw, 76px);
      font-weight: 800;
      letter-spacing: -.055em;
      line-height: .98;
    }
    .hero-buttons {
      display: flex;
      gap: 24px;
    }
    .hero-buttons button {
      min-width: 165px;
      padding: 15px 34px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 17px;
      transition: .22s;
    }
    #yes:hover {
      background: #c0392b;
      color: #fff;
      transform: translateY(-2px);
      border-color: #c0392b;
    }
    #no {
      position: relative;
    }

    .page-title {
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 800;
      letter-spacing: -.045em;
      line-height: 1.05;
      margin: 0 0 12px;
    }
    .page-subtitle {
      font-size: 17px;
      color: #444;
      margin: 0 0 34px;
    }
    .back {
      position: absolute;
      top: 32px;
      left: 34px;
      border: 0;
      background: none;
      color: #666;
      padding: 5px 0;
      font-size: 14px;
    }
    .back:hover {
      color: #111;
    }

    /* выбор свидания — новые варианты */
    .choice-grid {
      width: min(820px, 100%);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .choice {
      min-height: 142px;
      border: 1px solid #cfcfcf;
      border-radius: 20px;
      padding: 22px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }
    .choice::before {
      content: "";
      position: absolute;
      inset: -22px;
      background-size: cover;
      background-position: center;
      filter: blur(3px) brightness(1.2) saturate(1.1);
      transform: scale(1.08);
      opacity: .45;
      z-index: -2;
    }
    .choice::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.55);
      z-index: -1;
      transition: background .35s;
    }
    .choice:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(0, 0, 0, .09);
      border-color: #111;
    }
    .choice:hover::after {
      background: rgba(255, 255, 255, 0.25);
    }
    .choice.selected {
      border-color: #111;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .10);
    }
    .choice.selected::after {
      background: rgba(255, 255, 255, 0.20);
    }

    /* фоновые картинки — чуть ярче */
    .choice:nth-child(1)::before {
      background-image: url('https://images.unsplash.com/photo-1523438885200-e635ba2c371e?auto=format&fit=crop&w=1000&q=80&brightness=1.1');
    }
    .choice:nth-child(2)::before {
      background-image: url('https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=1000&q=80&brightness=1.1');
    }
    .choice:nth-child(3)::before {
      background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1000&q=80&brightness=1.1');
    }
    .choice:nth-child(4)::before {
      background-image: url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1000&q=80&brightness=1.1');
    }
    .choice:nth-child(5)::before {
      background-image: url('https://images.unsplash.com/photo-1533601712787-57d1c8756087?auto=format&fit=crop&w=1000&q=80&brightness=1.1');
    }
    .choice:nth-child(6)::before {
      background-image: url('https://images.unsplash.com/photo-1551698618-1dfe5d97d256?auto=format&fit=crop&w=1000&q=80&brightness=1.1');
    }
    .choice:nth-child(7)::before {
      background-image: url('https://images.unsplash.com/photo-1534777367038-9404f45b869b?auto=format&fit=crop&w=1000&q=80&brightness=1.1');
    }
    .choice-content {
      display: flex;
      align-items: center;
      gap: 22px;
      width: min(285px, 100%);
    }
    .icon {
      font-size: 38px;
      line-height: 1;
      filter: grayscale(0.3);
    }
    .choice-name {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    /* календарь + время */
    .booking {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: stretch;
    }
    .panel {
      border: 1px solid #ddd;
      border-radius: 20px;
      background: #fff;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, .035);
    }
    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .month {
      font-size: 20px;
      font-weight: 700;
    }
    .round-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 20px;
      padding: 0;
    }
    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .weekday {
      font-size: 11px;
      color: #777;
      padding-bottom: 7px;
    }
    .day {
      border: 0;
      border-radius: 50%;
      aspect-ratio: 1;
      padding: 0;
      background: transparent;
      font-size: 14px;
    }
    .day:not(:disabled):hover {
      background: #eee;
    }
    .day.selected {
      background: #111;
      color: #fff;
    }
    .day:disabled {
      color: #bbb;
      cursor: default;
    }
    .time-panel {
      text-align: left;
    }
    .time-title {
      font-size: 17px;
      margin: 0 0 18px;
      font-weight: 500;
    }
    .time-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .time {
      border: 1px solid #d7d7d7;
      border-radius: 14px;
      padding: 12px 6px;
      background: #fff;
      font-size: 14px;
      transition: .2s;
    }
    .time:hover {
      border-color: #111;
    }
    .time.selected {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .continue {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 999px;
      background: #111;
      color: #fff;
      padding: 15px 22px;
      font-weight: 600;
      font-size: 16px;
    }
    .continue:hover {
      transform: translateY(-1px);
    }
    .confirm {
      margin-top: 13px;
      text-align: center;
      color: #777;
      font-size: 13px;
      min-height: 18px;
    }

    /* кнопка поделиться */
    .share-btn {
      position: absolute;
      bottom: 28px;
      right: 34px;
      border: 1px solid #ccc;
      border-radius: 30px;
      padding: 8px 20px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      color: #333;
      transition: .25s;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    .share-btn:hover {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .share-btn::before {
      content: "🔗";
      font-size: 16px;
    }
    .share-tip {
      position: fixed;
      bottom: 90px;
      right: 34px;
      background: #222;
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(10px);
      transition: .3s;
      pointer-events: none;
      z-index: 20;
    }
    .share-tip.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 700px) {
      .screen {
        padding: 70px 18px 42px;
      }
      .hero-title {
        font-size: 42px;
      }
      .hero-buttons {
        gap: 12px;
      }
      .hero-buttons button {
        min-width: 130px;
      }
      .choice-grid {
        grid-template-columns: 1fr;
      }
      .choice {
        min-height: 110px;
      }
      .booking {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .back {
        top: 20px;
        left: 20px;
      }
      .share-btn {
        bottom: 16px;
        right: 16px;
        padding: 6px 16px;
        font-size: 12px;
      }
      .share-tip {
        bottom: 72px;
        right: 16px;
        font-size: 12px;
        padding: 8px 14px;
      }
    }
  </style>
</head>
<body>

  <!-- 1 -->
  <main id="screen1" class="screen">
    <div class="heart top">♥</div>
    <div class="heart small1">♥</div>
    <div class="heart small2">♥</div>
    <div class="heart bottom">♥</div>
    <h1 class="hero-title">Пойдёшь со мной<br>на свидание?</h1>
    <div class="hero-buttons">
      <button id="yes">ДА!</button>
      <button id="no">НЕТ</button>
    </div>
    <button class="share-btn" data-share>Поделиться</button>
    <div id="shareTip" class="share-tip">Ссылка скопирована!</div>
  </main>

  <!-- 2 -->
  <main id="screen2" class="screen hidden">
    <button class="back" id="back2">← &nbsp;Назад</button>
    <div class="heart top">♥</div>
    <h1 class="page-title">Я знала, что ты согласишься!</h1>
    <p class="page-subtitle">Выбери, какое свидание ты хочешь:</p>
    <div class="choice-grid">
      <button class="choice"><span class="choice-content"><span class="icon">♧</span><span class="choice-name">Пикник<br>на природе</span></span></button>
      <button class="choice"><span class="choice-content"><span class="icon">♧</span><span class="choice-name">Прогулка<br>по парку</span></span></button>
      <button class="choice"><span class="choice-content"><span class="icon">♢</span><span class="choice-name">Вечер<br>в ресторане</span></span></button>
      <button class="choice"><span class="choice-content"><span class="icon">⌂</span><span class="choice-name">Домашние<br>посиделки</span></span></button>
      <button class="choice"><span class="choice-content"><span class="icon">🚲</span><span class="choice-name">Велосипедная<br>прогулка</span></span></button>
      <button class="choice"><span class="choice-content"><span class="icon">🔐</span><span class="choice-name">Поход<br>в квест</span></span></button>
      <button class="choice"><span class="choice-content"><span class="icon">🐴</span><span class="choice-name">Конная<br>прогулка</span></span></button>
    </div>
    <button class="share-btn" data-share>Поделиться</button>
    <div id="shareTip2" class="share-tip">Ссылка скопирована!</div>
  </main>

  <!-- 3 -->
  <main id="screen3" class="screen hidden">
    <button class="back" id="back3">← &nbsp;Назад</button>
    <div class="heart top">♥</div>
    <h1 class="page-title">Выбери дату и время</h1>
    <div class="booking">
      <section class="panel">
        <div class="calendar-head">
          <button id="prev" class="round-btn">‹</button>
          <div id="month" class="month"></div>
          <button id="next" class="round-btn">›</button>
        </div>
        <div class="weekdays">
          <div class="weekday">ПН</div><div class="weekday">ВТ</div><div class="weekday">СР</div>
          <div class="weekday">ЧТ</div><div class="weekday">ПТ</div><div class="weekday">СБ</div><div class="weekday">ВС</div>
        </div>
        <div id="days" class="days"></div>
      </section>

      <section class="panel time-panel">
        <p class="time-title">Выбери время:</p>
        <div id="times" class="time-grid"></div>
        <button id="continue" class="continue">Продолжить&nbsp;&nbsp;→</button>
        <div id="confirm" class="confirm"></div>
      </section>
    </div>
    <button class="share-btn" data-share>Поделиться</button>
    <div id="shareTip3" class="share-tip">Ссылка скопирована!</div>
  </main>

  <script>
    (function() {
      const s1 = document.getElementById('screen1');
      const s2 = document.getElementById('screen2');
      const s3 = document.getElementById('screen3');

      function go(from, to, after) {
        from.classList.add('fade-out');
        setTimeout(() => {
          from.classList.add('hidden');
          from.classList.remove('fade-out');
          to.classList.remove('hidden');
          to.classList.add('fade-in');
          if (after) after();
          setTimeout(() => to.classList.remove('fade-in'), 600);
        }, 300);
      }

      document.getElementById('yes').onclick = () => go(s1, s2);
      document.getElementById('back2').onclick = () => go(s2, s1);
      document.getElementById('back3').onclick = () => go(s3, s2);

      // Убегающая кнопка "НЕТ"
      const no = document.getElementById('no');
      function escapeNo() {
        no.style.position = 'fixed';
        no.style.left = Math.max(18, Math.random() * (innerWidth - no.offsetWidth - 36) + 18) + 'px';
        no.style.top = Math.max(18, Math.random() * (innerHeight - no.offsetHeight - 36) + 18) + 'px';
      }
      no.addEventListener('mouseenter', escapeNo);
      no.addEventListener('touchstart', e => { e.preventDefault(); escapeNo(); }, { passive: false });

      // Выбор свидания
      const choices = document.querySelectorAll('.choice');
      choices.forEach(c => c.onclick = () => {
        choices.forEach(x => x.classList.remove('selected'));
        c.classList.add('selected');
        setTimeout(() => go(s2, s3, renderCalendar), 220);
      });

      // ----- КАЛЕНДАРЬ (с шагом времени 30 мин) -----
      const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let current = new Date(today.getFullYear(), today.getMonth(), 1);
      let selectedDate = null;
      let selectedTime = null;

      const timeSlots = [];
      for (let h = 10; h <= 21; h++) {
        for (let m = 0; m < 60; m += 30) {
          if (h === 21 && m > 30) break;
          const str = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
          timeSlots.push(str);
        }
      }

      function renderCalendar() {
        const y = current.getFullYear();
        const m = current.getMonth();
        document.getElementById('month').textContent = monthNames[m] + ' ' + y;
        const days = document.getElementById('days');
        days.innerHTML = '';
        const offset = (new Date(y, m, 1).getDay() + 6) % 7;
        const count = new Date(y, m + 1, 0).getDate();

        for (let i = 0; i < offset; i++) {
          const b = document.createElement('button');
          b.className = 'day';
          b.disabled = true;
          days.appendChild(b);
        }
        for (let d = 1; d <= count; d++) {
          const date = new Date(y, m, d);
          date.setHours(0, 0, 0, 0);
          const b = document.createElement('button');
          b.className = 'day';
          b.textContent = d;
          if (date < today) {
            b.disabled = true;
          } else {
            b.onclick = () => {
              selectedDate = date;
              renderCalendar();
              updateConfirm();
            };
          }
          if (selectedDate && date.getTime() === selectedDate.getTime()) {
            b.classList.add('selected');
          }
          days.appendChild(b);
        }
      }

      document.getElementById('prev').onclick = () => {
        const min = new Date(today.getFullYear(), today.getMonth(), 1);
        const candidate = new Date(current.getFullYear(), current.getMonth() - 1, 1);
        if (candidate >= min) {
          current = candidate;
          renderCalendar();
        }
      };
      document.getElementById('next').onclick = () => {
        current = new Date(current.getFullYear(), current.getMonth() + 1, 1);
        renderCalendar();
      };

      const timesBox = document.getElementById('times');
      timeSlots.forEach(t => {
        const b = document.createElement('button');
        b.className = 'time';
        b.textContent = t;
        b.onclick = () => {
          selectedTime = t;
          document.querySelectorAll('.time').forEach(x => x.classList.remove('selected'));
          b.classList.add('selected');
          updateConfirm();
        };
        timesBox.appendChild(b);
      });

      function updateConfirm() {
        const box = document.getElementById('confirm');
        if (!selectedDate && !selectedTime) {
          box.textContent = '';
          return;
        }
        let parts = [];
        if (selectedDate) parts.push(selectedDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }));
        if (selectedTime) parts.push(selectedTime);
        box.textContent = 'Выбрано: ' + parts.join(' · ');
      }

      document.getElementById('continue').onclick = () => {
        if (!selectedDate || !selectedTime) {
          document.getElementById('confirm').textContent = 'Сначала выбери дату и время ♥';
        } else {
          updateConfirm();
        }
      };

      renderCalendar();

      // ----- КНОПКА ПОДЕЛИТЬСЯ (открывающаяся ссылка) -----
      const shareBtns = document.querySelectorAll('[data-share]');
      const tipIds = ['shareTip', 'shareTip2', 'shareTip3'];

      shareBtns.forEach((btn, idx) => {
        btn.addEventListener('click', async () => {
          const url = window.location.href;
          try {
            await navigator.clipboard.writeText(url);
            showTip(tipIds[idx]);
          } catch {
            // fallback
            const textarea = document.createElement('textarea');
            textarea.value = url;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showTip(tipIds[idx]);
          }
        });
      });

      function showTip(id) {
        const tip = document.getElementById(id);
        if (!tip) return;
        tip.classList.add('show');
        clearTimeout(tip._timer);
        tip._timer = setTimeout(() => tip.classList.remove('show'), 2200);
      }
    })();
  </script>
</body>
</html>
